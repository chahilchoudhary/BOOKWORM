openapi: 3.0.3
info:
  title: Book Worm API
  version: 0.0.0
servers:
  - url: http://localhost:4000/api
paths:
  /health:
    get:
      summary: Liveness check
      responses:
        '200':
          description: API is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
