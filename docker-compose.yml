services:
  postgres:
    image: registry.redhat.io/rhel9/postgresql-16:latest
    environment:
      POSTGRESQL_USER: ${POSTGRES_USER:-bookworm}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-bookworm}
      POSTGRESQL_DATABASE: ${POSTGRES_DB:-bookworm}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/pgsql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U $${POSTGRESQL_USER} -d $${POSTGRESQL_DATABASE}']
      interval: 5s
      timeout: 5s
      retries: 10
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  postgres-test:
    image: registry.redhat.io/rhel9/postgresql-16:latest
    environment:
      POSTGRESQL_USER: ${POSTGRES_USER:-bookworm}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-bookworm}
      POSTGRESQL_DATABASE: ${POSTGRES_TEST_DB:-bookworm_test}
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U $${POSTGRESQL_USER} -d $${POSTGRESQL_DATABASE}']
      interval: 5s
      timeout: 5s
      retries: 10
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
